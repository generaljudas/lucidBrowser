[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riptide-pipeline"
version = "0.0.1"
description = "Offline corpus pipeline for Riptide: acquisition, chunking, embedding, int8 quantisation, packing (skeleton - roadmap M2). Never runs in the browser."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["riptide_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
